<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 320" width="1180" height="320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7af2a8"/>
      <stop offset="1" stop-color="#2fae63"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#0d1420"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd07f" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#3fd07f" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#3fd07f" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="2" y="2" width="1176" height="316" rx="16" fill="url(#bg)" stroke="#1e2633" stroke-width="2"/>
  <rect x="2" y="2" width="1176" height="316" rx="16" fill="none" stroke="#3fd07f" stroke-opacity="0.18" stroke-width="2"/>

  <!-- terminal chrome -->
  <circle cx="36" cy="32" r="6" fill="#ff5c6c"/>
  <circle cx="58" cy="32" r="6" fill="#f2c94c"/>
  <circle cx="80" cy="32" r="6" fill="#3fd07f"/>
  <text x="108" y="37" font-size="13" fill="#7a869a">~/bundlescan — mev bundle analyzer</text>

  <!-- generic green capsule mark (original), top-right -->
  <g transform="translate(1098 46) rotate(-24)">
    <rect x="-44" y="-16" width="88" height="32" rx="16" fill="url(#green)" stroke="#0b0e14" stroke-width="2"/>
    <rect x="-44" y="-16" width="44" height="32" rx="16" fill="#0b0e14" fill-opacity="0.16"/>
    <circle cx="20" cy="-3" r="3.4" fill="#0b0e14"/>
  </g>

  <!-- wordmark -->
  <g filter="url(#glow)">
    <text x="56" y="168" font-size="92" font-weight="700" fill="url(#green)" letter-spacing="-2">bundlescan</text>
  </g>
  <text x="62" y="168" font-size="92" font-weight="700" fill="#3fd07f" fill-opacity="0" letter-spacing="-2">bundlescan</text>

  <!-- blinking-cursor block after the wordmark -->
  <rect x="648" y="120" width="20" height="52" rx="3" fill="#3fd07f" fill-opacity="0.85"/>

  <!-- divider -->
  <rect x="58" y="200" width="760" height="2" fill="url(#fade)"/>

  <!-- tagline -->
  <text x="58" y="238" font-size="17" fill="#9fb0c3">// real-time MEV on Solana — <tspan fill="#3fd07f">detect</tspan> sandwiches · <tspan fill="#f2c94c">quantify</tspan> victim loss · <tspan fill="#56c7e6">defend</tspan> wallets</text>

  <!-- prompt lines -->
  <text x="58" y="278" font-size="15" fill="#7a869a">$ <tspan fill="#3fd07f">node</tspan> bot/scanner.mjs <tspan fill="#7a869a">--min-profit 0.01</tspan></text>
  <text x="58" y="300" font-size="15" fill="#7a869a">┌─ SANDWICH DETECTED ─┐  <tspan fill="#3fd07f">+0.1081 SOL</tspan>  <tspan fill="#ff5c6c">-0.0943 SOL</tspan>  <tspan fill="#f2c94c">tip 0.005</tspan></text>
</svg>
